<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Products</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./Images/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />

    <style>
      body {
        background-color: #f4f4f7;
        overflow-x: hidden;
      }

      .products-grid {
        max-width: 1300px;
        margin: 160px auto 80px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 35px;
        padding: 0 20px;
      }

      .product-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid rgba(0, 0, 0, 0.05);
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      .product-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.1),
          transparent
        );
        opacity: 0;
        transition: 0.3s;
      }

      .product-card:hover {
        transform: translateY(-12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        border-color: #d4af37;
      }

      .product-card:hover::before {
        opacity: 1;
      }

      .badge-premium {
        position: absolute;
        top: 15px;
        right: 15px;
        background: #000;
        color: #d4af37;
        font-size: 10px;
        font-weight: 800;
        padding: 5px 12px;
        border-radius: 50px;
        text-transform: uppercase;
        letter-spacing: 1px;
        z-index: 2;
      }

      .image-wrapper {
        width: 100%;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 25px;
        z-index: 1;
      }

      .image-wrapper a {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
      }

      .image-wrapper img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
        transition: transform 0.5s ease;
      }

      .product-card:hover .image-wrapper img {
        transform: scale(1.1) rotate(2deg);
      }

      .product-info {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        z-index: 1;
      }

      .title {
        font-size: 18px;
        font-weight: 700;
        color: #111;
        margin-bottom: 12px;
        line-height: 1.3;
        min-height: 48px;
      }

      .description {
        font-size: 13.5px;
        line-height: 1.6;
        color: #777;
        margin-bottom: 20px;
        flex-grow: 1;
      }

      .price-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 15px;
        border-top: 1px solid #eee;
      }

      .price {
        font-size: 20px;
        font-weight: 800;
        color: #000;
      }

      .btn-add {
        width: 40px;
        height: 40px;
        background: #000;
        color: #fff;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
        text-decoration: none;
      }

      .product-card:hover .btn-add {
        background: #d4af37;
        transform: rotate(90deg);
      }

      .floating-contact {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #25d366;
        color: white;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        z-index: 9999;
        transition: 0.3s;
        text-decoration: none;
      }

      .floating-contact:hover {
        transform: scale(1.1);
        color: white;
      }

      @media (max-width: 1100px) {
        .products-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 850px) {
        .products-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 576px) {
        .products-grid {
          grid-template-columns: 1fr;
          margin-top: 120px;
        }
      }
    </style>
  </head>

  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 1200,
        once: true,
        easing: "ease-out-back",
      });
    </script>
    <script src="./script.js"></script>
    <script src="./translation.js"></script>
  </body>
</html>
